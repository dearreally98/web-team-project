<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가상 미술관</title>
    <link rel="stylesheet" href="../css/index.css" />
  </head>
  <body>
    <header></header>
    <nav></nav>
    <main>

      <!-- 중세미술 -->
    <section id="medieval" class="gallery-section">

      <h2 class="section-title">중세미술</h2>

      <div class="gallery-grid">

        <div class="art-card">
          <a href="medieval-detail.html">
            <img src="/image/가수들의전쟁.webp"
              alt="중세대표작" class="art-image">
          </a>

          <div class="art-content">
            <h3 class="art-title">가수들의 전쟁</h3>
            <p>1855년</p>
            <p>모리츠 폰 슈빈트</p>
          </div>
        </div>

        <div class="art-card">
          <img src="/image/애도.webp"
            alt="중세1" class="art-image">

          <div class="art-content">
            <h3 class="art-title">애도</h3>
            <p>1305년</p>
            <p>조토 디 본도네</p>
          </div>
        </div>

        <div class="art-card">
          <img src="/image/악덕에관한논문집.webp"
            alt="중세2" class="art-image">

          <div class="art-content">
            <h3 class="art-title">악덕에 관한 논문집</h3>
            <p>14세기 후반</p>
            <p>이에르의 수도사 치보</p>
          </div>
        </div>

        <div class="art-card">
          <img src="/image/유스티니아누스황제와수행원들.webp"
            alt="중세3" class="art-image">

          <div class="art-content">
            <h3 class="art-title">유스티니아누스 황제와 수행원들</h3>
            <p>547년</p>
            <p>비잔틴 장인들</p>
          </div>
        </div>

      </div>

    </section>

    <!-- 근대미술 -->
    <section id="modern" class="gallery-section">

  <h2 class="section-title">근대미술</h2>

  <div class="gallery-grid">

    <div class="art-card">
      <a href="modern-detail.html">
        <img src="/image/별이빛나는밤.webp"
          alt="근대대표작" class="art-image">
      </a>

      <div class="art-content">
        <h3 class="art-title">별이 빛나는 밤</h3>
        <p>1889년</p>
        <p>빈센트 반 고흐</p>
      </div>
    </div>

    <div class="art-card">
      <img src="/image/아비뇽의처녀들.webp"
        alt="근대1" class="art-image">

      <div class="art-content">
        <h3 class="art-title">아비뇽의 처녀들</h3>
        <p>1907년</p>
        <p>파블로 피카소</p>
      </div>
    </div>

    <div class="art-card">
      <img src="/image/수련.webp"
        alt="근대2" class="art-image">

      <div class="art-content">
        <h3 class="art-title">수련</h3>
        <p>1916년경</p>
        <p>클로드 모네</p>
      </div>
    </div>

    <div class="art-card">
      <img src="/image/절규.webp"
        alt="근대3" class="art-image">

      <div class="art-content">
        <h3 class="art-title">절규</h3>
        <p>1893년</p>
        <p>에드바르 뭉크</p>
      </div>
    </div>

  </div>

</section>

    </main>
    <footer></footer>
  </body>
</html>
