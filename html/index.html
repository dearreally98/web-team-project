<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가상 미술관</title>
    <link rel="stylesheet" href="../css/index.css" />
  </head>
  <body>
    <header></header>
    <nav></nav>
    <main>
      <!-- 관람안내 -->
      <section id="visitor-info" class="visitor-section">
        <h2 class="section-title">관람안내</h2>

        <div class="info-box">
          <h3>운영시간</h3>

          <p>화요일 ~ 일요일</p>
          <p>09:00 ~ 18:00</p>
          <p>입장마감 : 17:00</p>
          <p>휴관일 : 매주 월요일</p>
        </div>

        <div class="price-box">
          <h3>관람요금</h3>

          <p>성인 : 10,000원</p>
          <p>청소년 : 7,000원</p>
          <p>어린이 : 5,000원</p>
        </div>

        <div class="location-box">
          <h3>위치안내</h3>

          <img
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/88/Simpleicons_Places_map-marker.svg/512px-Simpleicons_Places_map-marker.svg.png"
            alt="지도"
            class="map-image"
          />
        </div>

        <div class="notice-box">
          <h3>관람 유의사항</h3>

          <ul class="notice-list">
            <li>음식물 반입 금지</li>
            <li>플래시 촬영 금지</li>
            <li>작품 접촉 금지</li>
            <li>전시실 내 정숙</li>
          </ul>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
